{% extends "base.html" %}

{% block title %}Contact Us - Iris Flower Classification{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px;">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="text-center mb-5">
                <h1 class="header text-center mb-5">
                    <i class="fas fa-envelope"></i> Contact Us
                </h1>
                <p class="lead">Have questions? We'd love to hear from you!</p>
            </div>

            <!-- Contact Form -->
            <div class="card shadow-lg mb-4">
                <div class="card-header bg-gradient text-black">
                    <i class="fas fa-paper-plane"></i> Send us a Message
                </div>
                <div class="card-body">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" id="name" required placeholder="Enter your name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" required placeholder="Message subject">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" required placeholder="Write your message here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                    <div id="contactSuccess" class="alert alert-success mt-3" style="display: none;">
                        <i class="fas fa-check-circle"></i> Thank you! Your message has been sent successfully.
                    </div>
                </div>
            </div>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Get form data
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        
        // Here you can add backend integration to actually send emails
        // For now, just show success message
        console.log('Contact Form Submitted:', {name, email, subject, message});
        
        // Show success message
        document.getElementById('contactSuccess').style.display = 'block';
        
        // Reset form
        this.reset();
        
        // Hide success message after 5 seconds
        setTimeout(() => {
            document.getElementById('contactSuccess').style.display = 'none';
        }, 5000);
    });
</script>

<style>
    .btn-outline-primary:hover, .btn-outline-info:hover, 
    .btn-outline-danger:hover, .btn-outline-success:hover {
        transform: translateY(-3px);
        transition: all 0.3s ease;
    }
</style>
